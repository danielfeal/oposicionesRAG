# Single-VM deployment: Qdrant + the Chainlit app, both on one internal bridge network. 
#
# `app` is only published to 127.0.0.1 - Caddy is what actually faces the internet, 
# terminating TLS and reverse-proxying to `app` over the internal network. 
#
# Bring up: docker compose up -d --build
# Data persists under ./data/ (qdrant, caddy TLS state).

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - internal
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 60  # 5 min ceiling for cold-start disk load of the collection

  app:
    build: .
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Compose service names resolve over the `internal` network - these
      # override rag/config.py's localhost defaults, meant for running the
      # pipeline outside Docker.
      - RAG_QDRANT_HOST=qdrant
      - RAG_QDRANT_PORT=6333
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      - internal

networks:
  internal:
    driver: bridge
